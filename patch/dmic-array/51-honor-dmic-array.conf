# HONOR MagicBook Pro 14 AI (ZQC-P / M1010): the built-in microphone array,
# cleaned. Installed into /etc/pipewire/pipewire.conf.d/ by install.sh; read by
# every user's PipeWire.
#
# SOF captures the array as four channels: the two microphones, either side of
# the camera in the top bezel (FL right of it, FR left of it, as seen from the
# seat, ~6.5 cm apart), and the DSP's TDFB beam, twice (RL = RR). The beam is in opposite phase to the
# microphones, so an application's downmix of all four partly cancels the voice,
# and it is tuned for another geometry, so it colours the voice on its own. The
# two microphones summed are already a beam pointed at whoever sits in front of
# the screen. This takes them alone through WebRTC: a high-pass, noise
# suppression (the keyboard, mostly), gain control, and the echo of what plays
# (the default sink's monitor), as one source above the raw array's priority.
# See README.md for the measurements.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      audio.channels = 2
      audio.position = [ FL FR ]
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = true
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
      }
      capture.props = {
        node.name = "capture.honor-dmic"
        target.object = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
        audio.channels = 2
        audio.position = [ FL FR ]
        # FL and FR linked by name, RL and RR left out: without it the stream
        # takes all four ports and downmixes the beam back in
        stream.dont-remix = true
        # no capture, and no DSP wake, while nothing records from the source
        node.passive = true
      }
      source.props = {
        node.name = "honor-dmic"
        node.description = "Built-in Microphone"
        node.nick = "Built-in Microphone"
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 3000
      }
    }
  }
]
