# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=ALC256 headset microphone on the 3.5 mm jack
# The codec subsystem id the quirk keys on. The installer reads it off the
# running machine and refuses on a mismatch, so this directory cannot hand a
# foreign pin configuration to somebody else's codec.
device=1ee7:209d
# The SSID quirk to send upstream; the installer does not build it.
patch=alc269-headset-mic.patch
# Which alc269.c model this board needs, by its fixup_models[] name, handed to
# the driver as hda_model=. The stock ALC2XX_FIXUP_HEADSET_MIC leaves pin 0x19
# where GET_PIN_SENSE returns 0 after boot until the jack is replugged; what
# works is pin 0x19 = 0x01a1913c chained to the headset mode without an HP mic,
# and alc255-dell2 is exactly that (plus the CTIA default jack type). Verified
# on a ZQC-P M1010 (Core Ultra 5 338H) on 7.0.0-34, 2026-10-01. See README.md.
fixup=alc255-dell2
status=verified
origin=this repository, measured on ZQC-P M1010
