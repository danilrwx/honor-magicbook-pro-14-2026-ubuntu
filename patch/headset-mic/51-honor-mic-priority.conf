# HONOR MagicBook Pro 14 AI (ZQC-P / M1010)
#
# The ALC256 model in patch/headset-mic/ enables the analog 3.5 mm jack input
# on pin 0x19 with JACK_DETECT_OVERRIDE, because this codec reports no jack
# presence for it. The port is therefore always "available", and WirePlumber
# gave the resulting source (HiFi__Mic2__source, priority.session 2000) a
# higher priority than the built-in digital microphone array
# (HiFi__Mic1__source, 1648). Two things went wrong as a result:
#
#   1. with nothing plugged into the jack, the default capture source was a
#      dead analog input;
#   2. Fn+F7 muted "Capture Switch" instead of "Dmic0 Capture Switch", and the
#      mic-mute LED never lit, because the kernel's control-LED group only
#      tracks the DMIC control.
#
# Rank the jack input below the internal array. It stays fully usable, it is
# simply no longer the default.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input\\..*\\.HiFi__Mic2__source" }
    ]
    actions = {
      update-props = {
        priority.session = 1400
      }
    }
  }
]
