# Template for a device profile. Copy to devices/<model-in-lowercase>.conf.
#
# This file is the field reference: it is the one profile that carries comments,
# and it is meant to be read. **Strip them when you fill in a real profile.**
#
# A device profile holds data and nothing else. Everything that needs explaining
# — where a value came from, what is broken on that machine, which fix was tried
# and what happened — belongs in docs/hardware/<model>.md. Two reasons:
#
#   * a diff of a profile stays readable, so a changed id is obvious;
#   * one fact ends up recorded in one place, instead of in a comment here and
#     a paragraph there that quietly drift apart.
#
# lib/profile.sh warns if it finds a comment in any profile but this one.
#
# Rules:
#   * Strict key=value. The file is parsed, never sourced: no shell syntax, no
#     substitutions, no quotes around values.
#   * An unknown key is a hard error. A typo must not silently drop a value.
#   * Write `unknown` for anything you have not read off the hardware. Never
#     guess: a wrong PCI subsystem id or EC offset is worse than a missing one,
#     because the installers act on what is here.
#
# ==============================================================================
# THE SHAPE: a small base block, then one section per board revision
# ==============================================================================
#
# HONOR sells one product code as several different machines. ZQC-P is board
# M1010 with a Core Ultra X9 388H here, and board M1050 with a Core Ultra 5 338H
# in the report on issue #1. Same sys_vendor, same product_name, different
# silicon and, as far as anybody has checked, possibly different everything
# else.
#
# So the unit of trust is the board revision, not the product. The base block
# holds only what identifies the product; every reading, every measurement and
# every decision belongs to a `[board ...]` section. That is enforced by the
# parser, not left to good manners: a hardware id in the base block would apply
# a value read off one machine to every revision that ever boots this
# repository, which is precisely the bug this format exists to prevent.
#
# Two forms exist beyond the plain `[board M1010]`, and both are narrower than
# they look:
#
#   [board M1110 M1120]   several revisions that are PROVABLY the same machine.
#                         That takes evidence and it is usually absent: the two
#                         XWC-P units differ in webcam supplier, and DRA-XX
#                         M1030 and M1040 differ in CPU and in fingerprint
#                         reader. No profile here uses a merged header, and
#                         tools/selftest.sh rejects one until somebody does the
#                         comparison and records it in docs/hardware/.
#
#   [board *]             a product whose revisions are genuinely unknown. DRB-P
#                         is the only honest case here: no probe of a machine
#                         without the discrete GPU exists at all, so there is no
#                         revision to name. It is NOT a default for revisions
#                         that are known; beside named sections it would say
#                         "and anything else is like these", which nobody has
#                         checked, and selftest rejects that combination.
#
# A machine whose board_version matches no section, in a profile with no
# `[board *]`, keeps the product identity and gets status `probed`. It is never
# refused, and it never inherits somebody else's `verified`.

# ==============================================================================
# BASE BLOCK
# ==============================================================================
# These five keys and no others. They identify the product, and they are what
# selects this file: a section that changed one of them would be describing a
# different product and belongs in a file of its own.
#
# model    the product code, as HONOR reports it in DMI, upper case
# name     what the machine is sold as, for humans
# year     the marketing year. NOT a source of truth for the platform: the
#          MagicBook Pro 14 Ultra 5 is sold alongside the 2025 line and is
#          Meteor Lake silicon
#
# dmi_vendor and dmi_product are compared exactly, never as substrings: FMB-P is
# a prefix of FMB-PM, and the kernel's own DMI_MATCH being a substring test is
# exactly why the upstream atkbd quirk for one also catches the other.
#
# dmi_product is what the firmware says, not what the machine is sold as. HONOR
# reuses one string across a whole line and sometimes wildcards the digits:
# every 2024 MagicBook Pro 16 reports the literal string DRA-XX, whatever the
# box said. Write what dmidecode prints. A product code that never appears in
# DMI produces a profile that can never match anything.
model=
name=
year=
dmi_vendor=HONOR
dmi_product=

# ==============================================================================
# BOARD SECTION
# ==============================================================================
# The header is the board revision, from:
#
#   cat /sys/class/dmi/id/board_version
#
# M1010, M1020, M1030 ... There is deliberately no dmi_board_version key: the
# header is where the revision is written, and a second place to write it down
# is a second place for it to be wrong.
[board M1010]

# --- trust --------------------------------------------------------------------
# status decides what the installers are allowed to do ON THIS BOARD.
#
#   verified  read off this hardware, and the fixes were actually run on it.
#             The only status that unlocks fixes carrying model-specific
#             constants
#   reported  read off real hardware, but somebody else's: a dump, or a
#             credible report from another project, where somebody did run
#             something. Not re-checked here
#   probed    the ids are genuine readings from a hardware probe database, so
#             the hardware is described, but nobody has run a single fix
#             against that machine. Deliberately no more permissive than draft
#   draft     assembled from published specifications; most fields unknown
#
# origin  where the data came from, in a few words. One line, no prose: the
#         detail belongs in docs/hardware/<model>.md
# verified_*  what the machine was when somebody last confirmed this section.
#         verified_bios is informational. The ACPI override decides from the
#         md5 of the live table, not from this field, because a BIOS update
#         does not always rewrite the table and the model is not what matters
status=draft
origin=unknown
verified_kernel=unknown
verified_bios=unknown
verified_distro=unknown

# --- what this board is -------------------------------------------------------
# platform pantherlake | arrowlake | meteorlake | raptorlake | amd | unknown.
#          A recorded fact taken from the CPU, not from `year`, because several
#          fixes follow from it alone. `amd` is deliberately coarse: nothing
#          here keys on an AMD generation, so splitting it would be pretend
#          precision
# dgpu     none | nvidia | unknown. Discrete-GPU support is out of scope; this
#          field exists only to tell two variants of one product_name apart,
#          and detection uses it before it looks at the board
# cpu      the `model name` line from /proc/cpuinfo, verbatim. Inventory only:
#          nothing matches on it. It is here because it is usually the clearest
#          statement of what makes one revision different from another
# dmi_board       <product>-PCB throughout the line
# dmi_sku         NOT model-unique here. C233 is reported by ZQC-P, XWC-P, an
#                 FMB-P, a DRA-XX and BCC-N. Record it; it can only confirm,
#                 never decide, and detection consults it last
platform=unknown
dgpu=unknown
cpu=unknown
dmi_board=unknown
dmi_sku=unknown

# --- hardware inventory -------------------------------------------------------
# Facts about the machine. Every one of these can be read off a running unit or
# found in a hardware dump, which is why a reported or probed section can be
# complete here without anybody involved owning the laptop.
#
# Several accept a space separated LIST. The same board ships different parts in
# different regions and reports the same DMI either way, so they cannot be split
# into separate sections. List what the board is known to carry; the installer
# probes the bus and uses whichever is actually fitted (gate_probe_usb and
# gate_probe_hid in lib/gate.sh). A single value behaves exactly as a
# one-element list.
#
# Note the difference between the two kinds of id in this file. The board
# revision is a DISCRIMINATOR: it decides which section applies, and it has to
# be read from DMI before any fix runs. Everything below is INVENTORY: it is
# visible in sysfs once the machine is up, so an installer confirms it against
# the bus rather than trusting it. Never add an inventory key to what detection
# narrows on.
#
# Write `none` rather than `unknown` when a part is confirmed ABSENT — a model
# sold without a touchscreen, say. The two are not the same: `unknown` means
# nobody looked, `none` means somebody did and there is nothing there, and only
# the second is a reason to leave a fix off the list.
#
# touchscreen_hid / touchpad_hid   ls /sys/bus/hid/devices/ — the directory name
#                                  is BUS:VID:PID. Record vid:pid, lowercase.
#                                  Never infer one from the ACPI _HID: TOPS0102
#                                  is a slot name and HONOR has fitted at least
#                                  two different chips behind it
# audio_ssid                       subsystem_vendor:subsystem_device of the PCI
#                                  device of class 0x0401 or 0x0403. This is
#                                  what an HD-audio codec quirk keys on. On a
#                                  machine with a discrete GPU there are two:
#                                  take the Intel one, not the GPU's own HDMI
#                                  audio function
# fingerprint_usb                  lsusb, vid:pid lowercase. Very often a list
# camera_usb                       lsusb. Used to switch the webcam off in
#                                  software when the camera key is pressed
# panel                            oled | lcd | unknown
# backlight_max                    /sys/class/backlight/*/max_brightness
touchscreen_hid=unknown
touchpad_hid=unknown
audio_ssid=unknown
fingerprint_usb=unknown
camera_usb=unknown
panel=unknown
backlight_max=unknown

# --- what a fix needs, which is NOT here --------------------------------------
# The numbers a fix has to have before it can run on a board are deliberately
# not in this file. A backlight floor, the EC tachometer offsets, the charge
# pairs an EC arms, the alc269.c fixup a codec needs: none of them describes the
# machine, they describe what one fix does on it. They live with that fix, in
#
#     patch/<fix>/<model>/<board>/recipe.conf
#
# so preparing a fix for a board is writing one file next to the boards that
# already have it, instead of editing a file every other board also reads. The
# split is the same one this file makes between a section and its base block,
# one level further down.
#
#     patch/fan/<model>/<board>/            ec_fan0, ec_fan1
#     patch/battery/<model>/<board>/        presets
#     patch/oled-backlight/<model>/<board>/ backlight_min
#     patch/headset-mic/<model>/<board>/    fixup
#
# Nothing here can come out of a dump: somebody had to measure or choose it with
# the laptop in front of them, and that is the practical difference between a
# reported board and a verified one. docs/ADDING-A-MODEL.md walks through it.

# --- fixes that apply ---------------------------------------------------------
# Space separated, names matching the directories under patch/.
#
# **Leave this empty until somebody has run the fix on this exact board and
# said what happened.** Almost every section in devices/ is empty. The two that
# are not are ZQC-P M1010, the machine this repository has, and ZQC-P M1050,
# whose owner reported in enough detail across three issues to justify nine.
#
# That is stricter than it used to be, and deliberately. The table below says
# what *would* follow from a recorded value, and reasoning like that is how the
# list got filled in before: a probe database says a machine has an OLED panel,
# therefore list oled-backlight. But a probe is somebody else's `lshw` output.
# It is not a report that anything was installed, and listing a fix here is
# permission for an installer to act on hardware nobody here has seen.
#
# So the table is now a checklist for *after* a report arrives, not a licence to
# fill the field in from a dump:
#
#   the machine's own I2C_DEVT table has the same md5 as
#     dump/acpi/<model>/SSDT27_orig.aml   -> acpi-override
#   platform=pantherlake                 -> cdclk-ptl, sof-audio
#   touchscreen_hid recorded AND patch/micmute/<model>/<board>/ exists
#     for this machine                   -> micmute
#   touchpad_hid recorded AND patch/touchpad-edge/<model>/<board>/ exists
#     for this machine                   -> touchpad-edge
#   panel=oled AND patch/oled-backlight/<model>/<board>/
#     records backlight_min              -> oled-backlight
#   audio_ssid recorded AND the headset
#     microphone is reported dead there AND
#     patch/headset-mic/<model>/<board>/ records fixup -> headset-mic
#   fingerprint_usb recorded AND patch/fingerprint/<model>/<board>/ exists
#     for this machine                   -> fingerprint
#   patch/fan/<model>/<board>/ records ec_fan0 and ec_fan1 -> fan
#   patch/battery/<model>/<board>/ records presets         -> battery
#   huawei-wmi binds and codes are missing from its keymap -> hotkeys,
#     and hotkey-actions once hotkeys is listed
#   the built-in microphone array captures with its channels measured AND
#     patch/dmic-array/<model>/<board>/ records source -> dmic-array
#   any listed fix builds a kernel module or rebuilds a library -> auto-rebuild
#
# Once a fix is listed, listing a tier B one on a section that is not yet
# verified is still worth doing: it will refuse, and the refusal names exactly
# what is missing, which beats silence.
#
# acpi-override is listed when the machine's own I2C_DEVT table is the one this
# repository carries, and not otherwise. That is not the same as "the model it
# was dumped from": ZQC-P and XWC-P ship a byte-identical table, so the fix is
# correct on both. The installer settles it at run time by comparing the md5 of
# the live table against the stock one in dump/acpi/, and refuses on a mismatch,
# so listing it wrongly produces a refusal rather than a broken machine. A board
# whose table differs needs its own, rebuilt from its own firmware: docs/RESEARCH.md.
#
# WRITE THEM IN THIS ORDER, always, and leave out the ones that do not apply:
#
#   acpi-override  psr-band  oled-backlight  cdclk-ptl  edp-dsc  headset-mic
#   sof-audio  micmute  touchpad-edge  fan  fingerprint  battery  hotkeys
#   hotkey-actions  dmic-array  auto-rebuild
#
# That is the order apply_patch.sh runs them in, so a profile and a run put the
# same things in the same place. It matters because two sections of one file get
# compared: when each was written in whatever order it was thought of, telling
# what genuinely differs between two boards meant searching instead of reading
# down the page. The list lives once, as FIX_ORDER in lib/profile.sh, and
# tools/selftest.sh prints the corrected line if a profile disagrees with it.
fixes=

# ==============================================================================
# A CATCH-ALL SECTION, IF YOU HAVE SOMETHING TO SAY ABOUT REVISIONS YOU HAVE
# NEVER SEEN. Delete it if you do not.
# ==============================================================================
# [board *]
# status=probed
# origin=shared by the revisions above, not read off the machine this runs on
# platform=unknown
# dgpu=unknown
# fixes=
